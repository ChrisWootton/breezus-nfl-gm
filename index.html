<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breezus NFL GM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1f2937;
      --bg-card-hover: #283548;
      --border-color: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }

    .gm-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Top Nav */
    .gm-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .gm-logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gm-logo span {
      color: var(--accent-green);
    }

    /* Sync bar */
    .gm-sync-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .gm-input {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 180px;
    }

    .gm-btn {
      background: var(--accent-green);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }

    .gm-btn:hover {
      opacity: 0.9;
    }

    /* Tab Controls */
    .gm-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .gm-tab-btn {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .gm-tab-btn.active {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
    }

    /* Cards & Layout */
    .gm-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .gm-card-header {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #app-content {
      min-height: 400px;
    }
  </style>
</head>
<body>

  <div class="gm-container">
    <header class="gm-nav">
      <div class="gm-logo">
        <i class="fa-solid fa-football"></i> BREEZUS <span>NFL GM</span>
      </div>
      <div class="gm-sync-bar">
        <input type="text" id="gm-league-id" class="gm-input" placeholder="Sleeper League ID" value="131204730021373952">
        <button id="gm-sync-btn" class="gm-btn">SYNC</button>
      </div>
    </header>

    <div class="gm-tabs" id="gm-tabs-container">
      <button class="gm-tab-btn active" data-view="dashboard">GM Dashboard</button>
      <button class="gm-tab-btn" data-view="lineup">Lineup Lab</button>
      <button class="gm-tab-btn" data-view="defense">Defense Streamer</button>
      <button class="gm-tab-btn" data-view="dynasty">Dynasty War Room</button>
    </div>

    <div id="app-content">
      <!-- Dynamic views mounted by existing GM scripts -->
      <div class="gm-card">
        <div class="gm-card-header">Loading GM System...</div>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Connecting to Sleeper league and pulling authoritative roster data...</p>
      </div>
    </div>
  </div>

  <!-- Authoritative GM Production Scripts from your repository -->
  <script src="gm-v29-decision-engine.js"></script>
  <script src="gm-v30-authoritative-gm.js"></script>
  <script src="gm-v31-authoritative-gm.js"></script>
  <script src="gm-dynasty-war-room.js"></script>
  <script src="gm-app-v59-readability.js"></script>
</body>
</html>
